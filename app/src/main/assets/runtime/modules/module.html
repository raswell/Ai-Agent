<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="/runtime/css/home.css"><title>HomeOS Module</title><style>.module-page{position:relative;z-index:1;padding-top:34px}.module-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.back{border:1px solid #34465d;background:#17243a;color:#eef5fc;border-radius:12px;padding:12px 18px;font-weight:bold}.module-hero{padding:28px 32px;border:1px solid #26364c;border-radius:24px;background:linear-gradient(120deg,#17263b,#101927);margin-bottom:20px}.module-hero h1{font-size:34px;margin:0 0 8px}.module-hero p{color:var(--muted);margin:0}.module-sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.module-section{padding:22px;border:1px solid #26364c;border-radius:18px;background:#121d2e}.module-section h2{font-size:17px;margin:0 0 10px}.module-section p{color:var(--muted);font-size:13px;line-height:1.5}.module-item{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid #2b3a50;font-size:13px}.module-item strong{color:var(--accent)}@media(max-width:800px){.module-sections{grid-template-columns:1fr}}</style></head><body><div class="ambient"></div><main class="module-page"><div class="module-toolbar"><button class="back focusable" id="back">← Home</button><span class="muted">HOMEOS · MODULE RUNTIME</span></div><section class="module-hero"><p class="eyebrow" id="moduleId">MODULE</p><h1 id="moduleTitle">Loading…</h1><p id="moduleDescription"></p></section><div id="sections" class="module-sections"></div></main><script src="/runtime/js/module.js"></script></body></html>
