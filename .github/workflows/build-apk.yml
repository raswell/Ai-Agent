name: Build HomeOS TV v0.1.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ homeos-tv-010 ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeOS-TV-v0.1.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to apk-output-010 branch
        run: |
          mkdir -p /tmp/apkout && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/HomeOS-TV-v0.1.0-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan apk-output-010
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/apkout/HomeOS-TV-v0.1.0-debug.apk .
          git add HomeOS-TV-v0.1.0-debug.apk
          git commit -m "Built APK v0.1.0"
          git push -f origin apk-output-010
