name: Build HomeOS TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main, homeos-tv ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeOS-TV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to apk-output branch
        run: |
          mkdir -p /tmp/apkout && cp app/build/outputs/apk/debug/*.apk /tmp/apkout/HomeOS-TV-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan apk-output
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/apkout/HomeOS-TV-debug.apk .
          git add HomeOS-TV-debug.apk
          git commit -m "Built APK"
          git push -f origin apk-output
