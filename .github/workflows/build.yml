name: Build HomeOS TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - homeos-tv-rt2
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'

permissions:
  contents: write

concurrency:
  group: homeos-tv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK created: $APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: homeos-tv-runtime-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to apk-output-rt-1.0.0-2 branch
        if: github.ref == 'refs/heads/homeos-tv-rt2'
        run: |
          mkdir -p /tmp/apkout && cp app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/HomeOS-TV-Runtime-1.0.0-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan apk-output-rt-1.0.0-2
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/apkout/HomeOS-TV-Runtime-1.0.0-debug.apk .
          git add HomeOS-TV-Runtime-1.0.0-debug.apk
          git commit -m "Built APK runtime 1.0.0"
          git push -f origin apk-output-rt-1.0.0-2
