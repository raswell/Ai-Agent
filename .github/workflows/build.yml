name: Build HomeOS TV Runtime
on:
  workflow_dispatch:
  push:
    branches: [ main, homeos-tv-rt1 ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Generate SHA256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: homeos-tv-runtime-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Publish APK to apk-output-rt-1.0.0 branch
        if: github.ref == 'refs/heads/homeos-tv-rt1'
        run: |
          mkdir -p /tmp/apkout && cp app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/HomeOS-TV-Runtime-1.0.0-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan apk-output-rt-1.0.0
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/apkout/HomeOS-TV-Runtime-1.0.0-debug.apk .
          git add HomeOS-TV-Runtime-1.0.0-debug.apk
          git commit -m "Built APK runtime 1.0.0"
          git push -f origin apk-output-rt-1.0.0
