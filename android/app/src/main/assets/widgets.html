<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>HomeOS Widgets</title>
<style>
:root{color-scheme:dark;--bg:#142638;--card:#1d3b53;--fg:#f4f8fb;--muted:#aac0d2;--accent:#55c2ff}*{box-sizing:border-box}body{margin:0;padding:8px 0 24px;background:transparent;color:var(--fg);font:18px system-ui,sans-serif}.page-title{font-size:24px;font-weight:700;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{min-height:100px;border-radius:16px;padding:18px;background:var(--card);border:2px solid transparent;overflow:hidden}.card h3{font-size:15px;color:var(--muted);margin:0 0 10px}.value{font-size:25px;font-weight:700;overflow-wrap:anywhere}.desc{font-size:14px;color:var(--muted);margin-top:5px}.empty{color:var(--muted);padding:20px}.card button{font-size:16px;padding:10px 18px;border:0;border-radius:9px;background:var(--accent);color:#062033}.spacer{height:14px}
</style></head><body><main id="root"><div class="empty">HomeOS · local mode</div></main>
<script>
(function(){'use strict';const root=document.getElementById('root');function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(raw){let data;try{data=JSON.parse(raw)}catch(e){return}const page=data.page||{};const widgets=Array.isArray(page.widgets)?page.widgets:[];const theme=data.theme||{};if(theme.accent)document.documentElement.style.setProperty('--accent',safe(theme.accent));root.replaceChildren();const title=document.createElement('h1');title.className='page-title';title.textContent=page.title||'HomeOS';root.appendChild(title);const grid=document.createElement('section');grid.className='grid';widgets.forEach(w=>{if(!w||typeof w!=='object')return;const type=String(w.type||'text');if(type==='spacer'){const s=document.createElement('div');s.className='spacer';grid.appendChild(s);return;}const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=w.title||type;card.appendChild(h);if(type==='button'){const b=document.createElement('button');b.type='button';b.textContent=w.label||'Action';b.addEventListener('click',()=>{const d=document.createElement('div');d.className='desc';d.textContent='This action is a dashboard placeholder; no remote native command was executed.';card.appendChild(d)});card.appendChild(b)}else{const v=document.createElement('div');v.className='value';v.textContent=type==='clock'?new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):(w.value??(type==='status'?'Connected':'—'));card.appendChild(v);if(w.description){const p=document.createElement('div');p.className='desc';p.textContent=w.description;card.appendChild(p)}}grid.appendChild(card)});if(!widgets.length){const e=document.createElement('div');e.className='empty';e.textContent='No widgets on this page. Add widgets from the HomeOS dashboard.';root.appendChild(e)}else root.appendChild(grid)}window.HomeOS={render};})();
</script></body></html>
